services:
  app:
    build:
      context: .
      target: release
      additional_contexts:
        source: ${SOURCE:?the extracted release archive}
    image: ${IMAGE:?the image under test}
    # So the throwaway stack never clashes with a running dev stack.
    ports: !reset []

  db:
    image: izartu-dev-mysql:${MYSQL_VERSION:-latest}

  smoke:
    # For its curl.
    image: izartu-dev-php:${PHP_VERSION:-latest}
    command: [/smoke.sh]
    volumes:
      - ./tests/E2E/smoke.sh:/smoke.sh:ro
