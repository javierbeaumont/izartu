services:
  app:
    extends:
      file: docker/compose.yaml
      service: app
    build:
      context: .
      target: base
    image: !reset null
    restart: !reset null
    volumes:
      - .:/var/www/izartu

  db:
    extends:
      file: docker/compose.yaml
      service: db
    restart: !reset null
    volumes:
      - ./docker/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh

  test:
    # Dev-only tooling; the profile keeps `docker compose up` from booting it
    # (it is still reachable with `docker compose run --rm test`).
    build:
      context: .
      target: test
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    command: [vendor/bin/phpunit]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: izartu_test
      DB_PASS: ${DB_PASS:-}
      DB_USER: ${DB_USER:-}
      DEBUG: 1
    profiles: [test]
    volumes:
      - .:/var/www/izartu
    working_dir: /var/www/izartu

volumes:
  db_data:
