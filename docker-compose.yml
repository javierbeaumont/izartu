services:
  app:
    extends:
      file: docker/compose.yaml
      service: app
    build:
      context: .
      target: base
    image: !reset null
    restart: !reset null
    volumes:
      - .:/var/www/izartu

  db:
    extends:
      file: docker/compose.yaml
      service: db
    image: izartu-dev-mysql:${MYSQL_VERSION:-latest}
    restart: !reset null
    volumes:
      - ./docker/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh

  test:
    # Tooling, kept out of `docker compose up` by its profile.
    image: izartu-dev-php:${PHP_VERSION:-latest}
    command: [vendor/bin/phpunit]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: izartu_test
      DB_PASS: ${DB_PASS:-}
      DB_USER: ${DB_USER:-}
      DEBUG: 1
    profiles: [test]
    volumes:
      - .:/var/www/izartu
    working_dir: /var/www/izartu

volumes:
  db_data:
