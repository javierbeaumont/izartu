services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/izartu
    environment:
      DB_HOST: db
      DB_USER: izartuuser
      DB_PASS: izartupass
      DB_NAME: izartu
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: izartu
      MYSQL_USER: izartuuser
      MYSQL_PASSWORD: izartupass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./izartu.sql:/docker-entrypoint-initdb.d/izartu.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  db_data:
