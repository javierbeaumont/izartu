name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Dependencies are resolved per PHP rather than installed from the lock, so older versions get the PHPUnit major they
# support.
jobs:
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dev image
        run: make build

      - name: Resolve the dev dependencies
        run: make deps-update

      - name: Run the unit tests
        run: make test-unit

  integration:
    name: Integration / PHP ${{ matrix.php }} / MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.4', '9.7']
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      DB_PASS: izartu-ci
      DB_ROOT_PASS: izartu-ci-root
      DB_USER: izartu
      MYSQL_VERSION: ${{ matrix.mysql }}
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dev image
        run: make build

      - name: Resolve the dev dependencies
        run: make deps-update

      - name: Run the integration tests
        run: make test-integration

  # The published image, built once for the jobs that test it. A required check too: a job skipped because one it needs
  # failed passes as a check.
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image from the release archive
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          docker build --target release --build-context source="$RUNNER_TEMP/source" -t izartu:candidate .
          docker save -o "$RUNNER_TEMP/image.tar" izartu:candidate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  e2e:
    name: E2E
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load -i "$RUNNER_TEMP/image.tar"

      - name: Run the end-to-end test
        env:
          IMAGE: izartu:candidate
        run: make test-e2e

  extensions:
    name: Extensions
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load -i "$RUNNER_TEMP/image.tar"

      - name: Check the image's extensions
        env:
          IMAGE: izartu:candidate
        run: make check-extensions
