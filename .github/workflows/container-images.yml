name: Container images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/pin-mtimes.sh
      - docker/rootfs/**
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, so an older run never moves `main` after a newer one. Per ref, since a newer run cancels
# the one waiting: a push to `main` never cancels a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Shown on GHCR's package page.
env:
  DESCRIPTION: 'Self-hosted bookmark manager based on tags: nginx and PHP-FPM on Alpine, with MySQL alongside.'
  LICENSES: AGPL-3.0-or-later

# Built and tested natively on each platform, and tagged only when every platform passed.
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      # Every tag, to find the newest release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag `vX.Y.Z` publishes `X.Y.Z`, `X.Y` and `latest`, and `docker/compose.yaml` has to name `X.Y`; anything else
      # publishes `main`.
      - name: Resolve the version and its tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          # Through env: a ${{ }} inside the run block is substituted as text, and git allows shell metacharacters in a
          # tag name.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "version=main" >> "$GITHUB_OUTPUT"
            echo "tags=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ $TAG_NAME =~ $release ]]; then
            echo "refusing to publish tag '$TAG_NAME': not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG_NAME")" != tag ]; then
            echo "refusing to publish tag $TAG_NAME: not annotated; its message is the release's title and notes" >&2
            exit 1
          fi
          newest=$(git tag --list 'v*' --sort=-version:refname | grep -E -m1 "$release")
          if [ "$TAG_NAME" != "$newest" ]; then
            echo "refusing to publish tag $TAG_NAME: only the latest release, $newest, is maintained" >&2
            exit 1
          fi
          version=${TAG_NAME#v}
          minor=${version%.*}
          named=$(sed -n 's|^ *image: javierbeaumont/izartu:||p' docker/compose.yaml)
          if [ "$named" != "$minor" ]; then
            echo "docker/compose.yaml names the image $named, not $minor" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$version $minor latest" >> "$GITHUB_OUTPUT"

  build:
    name: Build / ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-${{ matrix.ubuntu }}${{ matrix.arch == 'arm64' && '-arm' || '' }}
    timeout-minutes: 30
    # Holds DOCKERHUB_PUSH_TOKEN, and only `main` and the tags `v*` may use it.
    environment: container-registries
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        # One Ubuntu for both platforms: arm64 has no `-latest` label to follow.
        ubuntu:
          - '26.04'
    env:
      NAMES: docker.io/${{ github.repository }},ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What a release download carries, and the commit's time, which caps the image's file times.
      - name: Extract the release archive
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Docker Hub account is the repository owner's.
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          username: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-contexts: source=${{ runner.temp }}/source
          context: .
          labels: &labels |
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=${{ env.LICENSES }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=docker,rewrite-timestamp=true
          tags: izartu-e2e
          target: release

      - name: Run the end-to-end test
        env:
          IMAGE: izartu-e2e
        run: make test-e2e

      # The same build, from the cache: the image just tested.
      - name: Push the image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-contexts: source=${{ runner.temp }}/source
          context: .
          labels: *labels
          outputs: type=image,"name=${{ env.NAMES }}",push-by-digest=true,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          target: release

      # buildx's attestations are unsigned: each platform's SBOM is signed with Sigstore, on its image as the index
      # lists it.
      - name: Extract the SBOM
        id: sbom
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker buildx imagetools inspect "ghcr.io/$REPOSITORY@$DIGEST" --format '{{json .SBOM.SPDX}}' \
            > "$RUNNER_TEMP/sbom.spdx.json"
          docker buildx imagetools inspect "ghcr.io/$REPOSITORY@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "digest=" + .digest' >> "$GITHUB_OUTPUT"

      - name: Sign the SBOM on Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          subject-digest: ${{ steps.sbom.outputs.digest }}
          subject-name: docker.io/${{ github.repository }}

      # Kept in GitHub's attestation store only: GHCR would store it under a tag `sha256-<digest>`, which its package
      # page then shows as the latest version.
      - name: Sign the SBOM for GHCR
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          subject-digest: ${{ steps.sbom.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish
    needs:
      - build
      - version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: container-registries
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          username: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Tag the image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          REPOSITORY: ${{ github.repository }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          read -ra tags <<< "$TAGS"
          # GHCR reads a multi-platform image's description from the index, not from its labels.
          args=(
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION"
            --annotation "index:org.opencontainers.image.licenses=$LICENSES"
          )
          for tag in "${tags[@]}"; do
            args+=(--tag "docker.io/$REPOSITORY:$tag" --tag "ghcr.io/$REPOSITORY:$tag")
          done
          for digest in *; do
            args+=("ghcr.io/$REPOSITORY@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "ghcr.io/$REPOSITORY:${tags[0]}" --format '{{json .Manifest}}' \
            | jq -r '"digest=" + .digest' >> "$GITHUB_OUTPUT"

      # The provenance signed with Sigstore, on the index.
      - name: Sign the provenance on Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.index.outputs.digest }}
          subject-name: docker.io/${{ github.repository }}

      # In GitHub's attestation store only, as the SBOM.
      - name: Sign the provenance for GHCR
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.index.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}

  # Only on a tag's push: a rebuild by hand republishes the image, not the release.
  release:
    name: Release
    needs:
      - publish
      - version
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # The whole history with its tags: `VERSION` names the tag, and the release's title and notes are its message.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The deployable tree with `VERSION` stamped, archived here: GitHub's own source archives are not guaranteed to
      # stay byte-identical. And the Compose file the README installs with.
      - name: Stage the release's files
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="izartu-$RELEASE_VERSION/" \
            --output="dist/izartu-$RELEASE_VERSION.tar.gz" HEAD
          cp docker/compose.yaml dist/
          cd dist
          sha256sum -- * > checksums.txt

      - name: Sign their provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Its title is the tag's subject, and its notes the rest of the tag's message, without the signature.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --verify-tag \
            --title "$(git tag --list --format='%(contents:subject)' "$TAG_NAME")" \
            --notes "$(git tag --list --format='%(contents:body)' "$TAG_NAME")" dist/*
