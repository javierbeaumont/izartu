name: Container images

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time, so a rebuild and a new release never move `X.Y` and `latest` out of order.
concurrency:
  group: ${{ github.workflow }}

# Shown on GHCR's package page.
env:
  DESCRIPTION: 'Self-hosted bookmark manager based on tags: nginx and PHP-FPM on Alpine, with MySQL alongside.'
  LICENSES: AGPL-3.0-or-later

# A release's code, from its tag, with `main`'s packaging: the Dockerfile, `docker/` and the Makefile. Built and tested
# natively on each platform, pushed to GHCR by digest, and tagged on both registries only when every platform passed.
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      packaging: ${{ steps.release.outputs.packaging }}
      published: ${{ steps.release.outputs.published }}
      tag: ${{ steps.release.outputs.tag }}
      tags: ${{ steps.release.outputs.tags }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Every tag and `main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release: the tag `vX.Y.Z` pushed, or the newest on a run by hand on `main`, which publishes it if its tag's
      # run did not and otherwise rebuilds it in place. It publishes `X.Y.Z`, `X.Y` and `latest`, and its
      # `docker/compose.yaml` has to name `X.Y`; any other ref is refused. The packaging is one commit of `main` for the
      # whole run.
      - name: Resolve the release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          # Through env: a ${{ }} inside the run block is substituted as text, and git allows shell metacharacters in a
          # tag name.
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          newest=$(git tag --list 'v*' --sort=-version:refname | grep -E -m1 "$release") || {
            echo "refusing to publish: no release tag vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != main ]; then
              echo "refusing to run on the $REF_TYPE $REF_NAME: a run by hand is on main, whose packaging it takes" >&2
              exit 1
            fi
            tag=$newest
            packaging=$GITHUB_SHA
          else
            tag=$REF_NAME
            if ! [[ $tag =~ $release ]]; then
              echo "refusing to publish tag '$tag': not vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [ "$tag" != "$newest" ]; then
              echo "refusing to publish tag $tag: only the latest release, $newest, is maintained" >&2
              exit 1
            fi
            packaging=$(git rev-parse origin/main)
          fi
          if ! git merge-base --is-ancestor "refs/tags/$tag" "$packaging"; then
            echo "refusing to publish tag $tag: main does not have its commit; push main, then run this by hand" >&2
            exit 1
          fi
          # The provenance names the run's commit: on a push, the tag's, which has to be the packaging's.
          if [ "$EVENT" = push ] && [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$packaging" ]; then
            echo "refusing to publish tag $tag: main has moved past its commit; run this by hand on main" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "refusing to publish tag $tag: not annotated; its message is the release's title and notes" >&2
            exit 1
          fi
          version=${tag#v}
          minor=${version%.*}
          named=$(git show "refs/tags/$tag:docker/compose.yaml" | sed -n 's|^ *image: javierbeaumont/izartu:||p')
          if [ "$named" != "$minor" ]; then
            echo "$tag's docker/compose.yaml names the image $named, not $minor" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "ghcr.io/$REPOSITORY:$version" > /dev/null 2> "$RUNNER_TEMP/error"; then
            published=true
          elif grep -qF "ghcr.io/$REPOSITORY:$version: not found" "$RUNNER_TEMP/error"; then
            published=false
          else
            cat "$RUNNER_TEMP/error" >&2
            exit 1
          fi
          {
            echo "commit=$(git rev-parse "refs/tags/$tag^{commit}")"
            echo "packaging=$packaging"
            echo "published=$published"
            echo "tag=$tag"
            echo "tags=$version $minor latest"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "$tag's code with the packaging of main at $packaging" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build / ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-${{ matrix.ubuntu }}${{ matrix.arch == 'arm64' && '-arm' || '' }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        # One Ubuntu for both platforms: arm64 has no `-latest` label to follow.
        ubuntu:
          - '26.04'
    steps:
      # The packaging, with the release's tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.packaging }}

      # What a release download carries, and its commit's time, which caps the image's file times.
      - name: Extract the release archive
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive "refs/tags/$TAG" | tar -x -C "$RUNNER_TEMP/source"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "refs/tags/$TAG")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-contexts: source=${{ runner.temp }}/source
          context: .
          labels: &labels |
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=${{ env.LICENSES }}
            org.opencontainers.image.revision=${{ needs.version.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.izartu.packaging=${{ needs.version.outputs.packaging }}
          outputs: type=docker,rewrite-timestamp=true
          tags: izartu-e2e
          target: release

      # The code's own VERSION: the image has to carry the release's archive.
      - name: Check the image's release
        env:
          COMMIT: ${{ needs.version.outputs.commit }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          printf 'describe: %s\ncommit: %s\n' "$TAG" "$COMMIT" > "$RUNNER_TEMP/expected"
          docker run --rm --entrypoint cat izartu-e2e /var/www/izartu/VERSION | grep -v '^#' \
            | diff "$RUNNER_TEMP/expected" -

      # Every extension the release's composer.json requires, and maybe more that `main`'s code requires.
      - name: Check the image's extensions
        env:
          CODE_TAG: ${{ needs.version.outputs.tag }}
          IMAGE: izartu-e2e
        run: make check-extensions

      - name: Check that two builds make the same system layers
        run: make check-layers

      # So a rebuild for Alpine's fixes that does not get them fails.
      - name: Check that the image has every fix Alpine published
        env:
          IMAGE: izartu-e2e
        run: |
          make upgradable > "$RUNNER_TEMP/upgradable"
          if [ -s "$RUNNER_TEMP/upgradable" ]; then
            echo "Alpine has newer versions of these packages:" >&2
            cat "$RUNNER_TEMP/upgradable" >&2
            exit 1
          fi

      # A rebuild in place, by hand or for Alpine's fixes.
      - name: Check the rebuild against the published image
        if: needs.version.outputs.published == 'true'
        env:
          IMAGE: izartu-e2e
          PUBLISHED: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
        run: make check-rebuild

      # The release's own test and Compose file.
      - name: Run the end-to-end test
        env:
          IMAGE: izartu-e2e
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/release" "refs/tags/$TAG"
          "$RUNNER_TEMP/release/tests/E2E/run.sh"

      # Only now, so the tests run without the push token on the runner.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      # The same build, from the cache: the image just tested.
      - name: Push the image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-contexts: source=${{ runner.temp }}/source
          context: .
          labels: *labels
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          target: release

      - name: Check that the pushed image has the tested one's layers
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! make check-pushed IMAGE=izartu-e2e PUSHED="ghcr.io/$REPOSITORY@$DIGEST"; then
            echo "ghcr.io/$REPOSITORY@$DIGEST stays, untagged, until deleted by hand" >&2
            exit 1
          fi

      # buildx's attestations are unsigned: each platform's SBOM is signed with Sigstore, on its image as the index
      # lists it.
      - name: Extract the SBOM
        id: sbom
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker buildx imagetools inspect "ghcr.io/$REPOSITORY@$DIGEST" --format '{{json .SBOM.SPDX}}' \
            > "$RUNNER_TEMP/sbom.spdx.json"
          docker buildx imagetools inspect "ghcr.io/$REPOSITORY@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "digest=" + .digest' >> "$GITHUB_OUTPUT"

      # Kept in GitHub's attestation store only: GHCR would store it under a tag `sha256-<digest>`, which its package
      # page then shows as the latest version.
      - name: Sign the SBOM for GHCR
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          subject-digest: ${{ steps.sbom.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          # So a later re-run publishes only images built again, with current packages.
          retention-days: 1

  publish:
    name: Publish
    needs:
      - build
      - version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds DOCKERHUB_PUSH_TOKEN, and only `main` and the tags `v*` may use it. The one job that writes to Docker Hub,
    # so a run records one deployment.
    environment: container-registries
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Docker Hub account is the repository owner's.
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          username: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      # A re-run of one platform's build after the other's digest artifact expired would publish the image without that
      # platform. The platforms are the build job's matrix.
      - name: Check that every platform has a digest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          digests=("$RUNNER_TEMP"/digests/*)
          for digest in "${digests[@]##*/}"; do
            docker buildx imagetools inspect "ghcr.io/$REPOSITORY@sha256:$digest" --format '{{json .Manifest}}' \
              | jq -r '.manifests[] | select(.platform.os != "unknown") | .platform.architecture'
          done | sort > "$RUNNER_TEMP/platforms"
          if ! printf '%s\n' amd64 arm64 | cmp -s - "$RUNNER_TEMP/platforms"; then
            echo "the digests are for '$(paste -sd ' ' "$RUNNER_TEMP/platforms")', not amd64 and arm64 once each" >&2
            exit 1
          fi

      # Docker Hub gets a copy of GHCR's.
      - name: Tag the image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          REPOSITORY: ${{ github.repository }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          read -ra tags <<< "$TAGS"
          # GHCR reads a multi-platform image's description from the index, not from its labels.
          args=(
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION"
            --annotation "index:org.opencontainers.image.licenses=$LICENSES"
          )
          for tag in "${tags[@]}"; do
            args+=(--tag "docker.io/$REPOSITORY:$tag" --tag "ghcr.io/$REPOSITORY:$tag")
          done
          for digest in *; do
            args+=("ghcr.io/$REPOSITORY@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "ghcr.io/$REPOSITORY:${tags[0]}" --format '{{json .Manifest}}' \
            | jq -r '"digest=" + .digest' >> "$GITHUB_OUTPUT"

      # Each platform's SBOM, signed on Docker Hub once the copy has its image; for GHCR, by its build.
      - name: Extract the SBOMs
        id: sbom
        working-directory: ${{ runner.temp }}/digests
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          for digest in *; do
            index="ghcr.io/$REPOSITORY@sha256:$digest"
            image=$(docker buildx imagetools inspect "$index" --format '{{json .Manifest}}' \
              | jq -c '.manifests[] | select(.platform.os != "unknown")')
            arch=$(jq -r .platform.architecture <<< "$image")
            docker buildx imagetools inspect "$index" --format '{{json .SBOM.SPDX}}' \
              > "$RUNNER_TEMP/sbom-$arch.spdx.json"
            echo "$arch=$(jq -r .digest <<< "$image")" >> "$GITHUB_OUTPUT"
          done

      - name: Sign the amd64 SBOM on Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          subject-digest: ${{ steps.sbom.outputs.amd64 }}
          subject-name: docker.io/${{ github.repository }}

      - name: Sign the arm64 SBOM on Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          subject-digest: ${{ steps.sbom.outputs.arm64 }}
          subject-name: docker.io/${{ github.repository }}

      # The provenance signed with Sigstore, on the index.
      - name: Sign the provenance on Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.index.outputs.digest }}
          subject-name: docker.io/${{ github.repository }}

      # In GitHub's attestation store only, as the SBOM.
      - name: Sign the provenance for GHCR
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.index.outputs.digest }}
          subject-name: ghcr.io/${{ github.repository }}

  # The per-platform indexes, unreferenced once the tagged index lists their images. Deleted by digest: those images are
  # untagged versions too.
  clean-up:
    name: Clean up
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - name: Delete the per-platform indexes from GHCR
        working-directory: ${{ runner.temp }}/digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versions="/users/$GITHUB_REPOSITORY_OWNER/packages/container/${GITHUB_REPOSITORY#*/}/versions"
          for digest in *; do
            id=$(gh api --paginate "$versions" | jq -r --arg name "sha256:$digest" '.[] | select(.name == $name) | .id')
            if [ -z "$id" ]; then
              echo "GHCR has no version sha256:$digest" >&2
              exit 1
            fi
            gh api --method DELETE "$versions/$id"
          done

  # The GitHub Release, unless it exists: a rebuild republishes only the image.
  release:
    name: Release
    needs:
      - publish
      - version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Look for the release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft \
            2> "$RUNNER_TEMP/error"); then
            if [ "$draft" = true ]; then
              echo "$TAG's release is a draft, left by a run that did not finish: delete it, then run this again" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'release not found' "$RUNNER_TEMP/error"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/error" >&2
            exit 1
          fi

      # The tag, with the whole history and every tag: `VERSION` names the tag, and the release's title and notes are
      # its message.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.exists == 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ needs.version.outputs.tag }}

      # The deployable tree with `VERSION` stamped, archived here: GitHub's own source archives are not guaranteed to
      # stay byte-identical. And the Compose file the README installs with.
      - name: Stage the release's files
        if: steps.existing.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="izartu-$RELEASE_VERSION/" \
            --output="dist/izartu-$RELEASE_VERSION.tar.gz" HEAD
          cp docker/compose.yaml dist/
          cd dist
          sha256sum -- * > checksums.txt

      - name: Sign their provenance
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Its title is the tag's subject, and its notes the rest of the tag's message, without the signature.
      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" --verify-tag \
            --title "$(git tag --list --format='%(contents:subject)' "$TAG_NAME")" \
            --notes "$(git tag --list --format='%(contents:body)' "$TAG_NAME")" dist/*
