name: Lint and static analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      # The PHP hooks need the Docker toolchain and run in the job below.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: php-cs-fixer, phpstan, composer-validate

  php:
    name: Style and static analysis
    runs-on: ubuntu-latest
    env:
      DB_PASS: izartu-ci
      DB_ROOT_PASS: izartu-ci-root
      DB_USER: izartu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dev image
        run: make build

      - name: Install the dev dependencies
        run: make deps

      - name: Check the code style
        run: make style

      - name: Run the static analysis
        run: make analyse

      - name: Check composer.json against the lock file
        run: make validate
