name: Supply-chain analysis

on:
  branch_protection_rule:
  schedule:
    - cron: 24 5 * * 1
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level env or defaults: OpenSSF Scorecard's publish step rejects them.

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write # publish results to the OpenSSF API
    steps:
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          # `archive`, the default, reads a tarball without the export-ignored files, the workflows among them.
          file_mode: git
          results_file: results.sarif
          results_format: sarif
          publish_results: true
