version: 2

updates:
  - package-ecosystem: composer
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    directory: /
    groups:
      composer:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    commit-message:
      prefix: image
    cooldown:
      default-days: 7
    directory: /
    groups:
      docker:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directory: /
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: pre-commit
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directory: /
    groups:
      hooks:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: uv
    allow:
      - dependency-type: all
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directory: /.github/pre-commit
    groups:
      pre-commit:
        patterns:
          - "*"
    schedule:
      interval: monthly
