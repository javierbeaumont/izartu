version: 2

updates:
  - package-ecosystem: composer
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    directory: /
    groups:
      composer:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: composer
    commit-message:
      prefix: tests
    cooldown:
      default-days: 7
    directory: /docker/dev/php-8.5
    groups:
      dev-tools:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    commit-message:
      prefix: image
    cooldown:
      default-days: 7
    directory: /
    groups:
      docker:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    commit-message:
      prefix: tests
    cooldown:
      default-days: 7
    directories:
      - /docker/dev/*
    groups:
      dev-images:
        patterns:
          - "*"
    # Each directory is one PHP or MySQL version: only its digest moves.
    ignore:
      - dependency-name: mysql
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directories:
      - /
      - /.github/actions/*
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: pre-commit
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directory: /
    groups:
      hooks:
        patterns:
          - "*"
    schedule:
      interval: monthly

  - package-ecosystem: uv
    allow:
      - dependency-type: all
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directory: /.github/pre-commit
    groups:
      pre-commit:
        patterns:
          - "*"
    schedule:
      interval: monthly
