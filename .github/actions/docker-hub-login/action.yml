name: Log in to Docker Hub
description: Logs in to avoid anonymous pull limits; without a token, or if the login fails, pulls stay anonymous.

inputs:
  token:
    description: A read-only Docker Hub token.
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      shell: bash
      env:
        DOCKERHUB_TOKEN: ${{ inputs.token }}
        DOCKERHUB_USERNAME: ${{ github.repository_owner }}
      run: |
        if [ -n "$DOCKERHUB_TOKEN" ]; then
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin \
            || echo '::warning::The Docker Hub login failed; pulls are anonymous.'
        fi
