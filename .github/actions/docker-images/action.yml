name: Docker images
description: Logs in to Docker Hub, loads the dev images from GitHub's cache and sets the env `make versions` prints.

inputs:
  token:
    description: A read-only Docker Hub token.
    default: ''
  php-version:
    description: The version of the dev PHP image to load, or latest; none if empty.
    default: ''
  mysql-version:
    description: The version of the dev MySQL image to load, or latest; none if empty.
    default: ''

outputs:
  php-hit:
    description: Whether the dev PHP image came from the cache.
    value: ${{ steps.php.outputs.cache-hit }}
  mysql-hit:
    description: Whether the dev MySQL image came from the cache.
    value: ${{ steps.mysql.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DOCKERHUB_TOKEN: ${{ inputs.token }}
        DOCKERHUB_USERNAME: ${{ github.repository_owner }}
      with:
        script: await require('./.github/scripts/docker-hub-login.js')({ core, exec })

    - name: Resolve the versions
      shell: bash
      env:
        MYSQL_VERSION: ${{ inputs.mysql-version }}
        PHP_VERSION: ${{ inputs.php-version }}
      run: make -s versions >> "$GITHUB_ENV"

    - name: Restore the dev PHP image
      id: php
      if: inputs.php-version != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dev-php.tar
        key: dev-php-${{ env.PHP_VERSION }}-${{ env.PHP_HASH }}

    - name: Load the dev PHP image
      if: steps.php.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i "$RUNNER_TEMP/dev-php.tar"

    - name: Restore the dev MySQL image
      id: mysql
      if: inputs.mysql-version != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dev-mysql.tar
        key: dev-mysql-${{ env.MYSQL_VERSION }}-${{ env.MYSQL_HASH }}

    - name: Load the dev MySQL image
      if: steps.mysql.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i "$RUNNER_TEMP/dev-mysql.tar"
