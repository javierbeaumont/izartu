[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = /tmp/php-fpm.sock
pm = ondemand
pm.max_children = 5
; The settings come from the container's environment.
clear_env = no
; PHP's errors reach the container's output one line each.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
