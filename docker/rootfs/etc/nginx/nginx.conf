daemon off;
error_log stderr;
pid /tmp/nginx.pid;
worker_processes auto;

events {
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    gzip on;
    gzip_types text/css image/svg+xml;
    gzip_vary on;

    # www-data cannot write the package's own directories.
    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    scgi_temp_path /tmp/nginx-scgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;

    # The healthcheck's requests, the only ones from inside the container, stay out of the access log.
    map $remote_addr $loggable {
        127.0.0.1 0;
        default 1;
    }
    access_log /dev/stdout combined if=$loggable;

    # Behind a proxy that terminates TLS, PHP marks the session cookie Secure when the proxy says the request was HTTPS.
    map $http_x_forwarded_proto $forwarded_https {
        https on;
        default "";
    }

    server {
        listen 8080;
        root /var/www/izartu/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Dotfiles at the root, such as Apache's .htaccess: no route starts with a dot.
        location ~ ^/\. {
            return 404;
        }

        location = /index.php {
            include fastcgi.conf;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_hide_header X-Powered-By;
        }
    }
}
